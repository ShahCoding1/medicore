<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Doctors | MediCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/doctors.css">
</head>

<body>

    <main class="container-fluid py-4">

        <!-- PAGE HEADER -->

        <div class="doctor-page-header">

            <div>
                <span class="text-uppercase small text-muted">
                    Clinical Management
                </span>

                <h1 class="h3 mb-1">
                    Doctors
                </h1>

                <p class="text-muted mb-0">
                    Manage doctors, specializations,
                    departments and availability.
                </p>
            </div>

            <button
                id="addDoctorBtn"
                class="btn btn-primary">
                + Add Doctor
            </button>

        </div>


        <!-- TOOLBAR -->

        <div class="doctor-toolbar">

            <div class="doctor-search">

                <input
                    type="search"
                    id="doctorSearch"
                    class="form-control"
                    placeholder="Search doctors, ID, specialization...">

            </div>

            <div>

                <select
                    id="doctorStatusFilter"
                    class="form-select">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <!-- TABLE -->

        <div class="doctor-table-wrapper">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>
                            <th>Doctor ID</th>
                            <th>Doctor</th>
                            <th>Specialization</th>
                            <th>Department</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Status</th>
                            <th>License</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="doctorsTableBody">

                        <tr>
                            <td
                                colspan="9"
                                class="text-center py-5 text-muted">

                                Loading doctors...

                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <!-- DOCTOR MODAL -->

    <div
        class="modal fade"
        id="doctorModal"
        tabindex="-1"
        aria-hidden="true">

        <div
            class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <div>

                        <span class="small text-muted">
                            Doctor Management
                        </span>

                        <h5
                            class="modal-title"
                            id="doctorModalTitle">

                            Add Doctor

                        </h5>

                    </div>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <form id="doctorForm">

                    <div class="modal-body">

                        <div class="row g-3">

                            <div class="col-md-4">

                                <label class="form-label">
                                    Doctor ID
                                </label>

                                <input
                                    type="text"
                                    id="doctorId"
                                    class="form-control"
                                    placeholder="DOC-001"
                                    required>

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="doctorFirstName"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="doctorLastName"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="doctorEmail"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    id="doctorPhone"
                                    class="form-control">

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    Specialization
                                </label>

                                <input
                                    type="text"
                                    id="doctorSpecialization"
                                    class="form-control"
                                    placeholder="Cardiology"
                                    required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label">
                                    License Number
                                </label>

                                <input
                                    type="text"
                                    id="doctorLicense"
                                    class="form-control">

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Department
                                </label>

                                <select
                                    id="doctorDepartment"
                                    class="form-select">

                                    <option value="">
                                        Unassigned
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select
                                    id="doctorGender"
                                    class="form-select">

                                    <option value="male">
                                        Male
                                    </option>

                                    <option value="female">
                                        Female
                                    </option>

                                    <option value="other"
                                            selected>
                                        Other
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    id="doctorStatus"
                                    class="form-select">

                                    <option
                                        value="active"
                                        selected>
                                        Active
                                    </option>

                                    <option value="inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-light"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Save Doctor

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script
        type="module"
        src="../js/doctors/doctors.js">
    </script>

</body>

</html>
