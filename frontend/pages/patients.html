<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patients | MediCore</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/patients.css"
    >
</head>

<body>

    <main class="container-fluid py-4">

        <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
        >

            <div>
                <div class="text-muted small mb-1">
                    Management
                </div>

                <h1 class="h3 mb-1">
                    Patients
                </h1>

                <p class="text-muted mb-0">
                    Manage patient records and registration information.
                </p>
            </div>

            <button
                id="addPatientButton"
                class="btn btn-primary"
                type="button"
            >
                + Add Patient
            </button>

        </div>

        <section class="patient-toolbar mb-4">

            <div class="row g-3">

                <div class="col-lg-8">

                    <label
                        for="patientSearch"
                        class="form-label"
                    >
                        Search patients
                    </label>

                    <input
                        id="patientSearch"
                        type="search"
                        class="form-control"
                        placeholder="Search by patient name, ID or phone..."
                    >

                </div>

                <div class="col-lg-4">

                    <label
                        for="patientStatusFilter"
                        class="form-label"
                    >
                        Status
                    </label>

                    <select
                        id="patientStatusFilter"
                        class="form-select"
                    >
                        <option value="">
                            All statuses
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>
                    </select>

                </div>

            </div>

        </section>

        <section class="patient-table-wrapper">

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>

                        <tr>
                            <th>Patient ID</th>
                            <th>Patient</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Date of Birth</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="patientsTableBody">

                        <tr>
                            <td
                                colspan="8"
                                class="text-center text-muted py-5"
                            >
                                Loading patients...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <div
        id="patientModal"
        class="patient-modal"
        aria-hidden="true"
    >

        <div class="patient-modal-dialog">

            <div class="patient-modal-content">

                <div
                    class="d-flex justify-content-between align-items-center mb-4"
                >

                    <div>
                        <h2
                            id="patientModalTitle"
                            class="h5 mb-1"
                        >
                            Add New Patient
                        </h2>

                        <p class="text-muted small mb-0">
                            Enter the patient's basic information.
                        </p>
                    </div>

                    <button
                        id="closePatientModal"
                        type="button"
                        class="btn-close"
                        aria-label="Close"
                    ></button>

                </div>

                <form id="patientForm">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label
                                for="patientId"
                                class="form-label"
                            >
                                Patient ID
                            </label>

                            <input
                                id="patientId"
                                type="text"
                                class="form-control"
                                placeholder="e.g. PAT-1005"
                                required
                            >

                        </div>

                        <div class="col-md-6">

                            <label
                                for="gender"
                                class="form-label"
                            >
                                Gender
                            </label>

                            <select
                                id="gender"
                                class="form-select"
                            >
                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                                <option value="other">
                                    Other
                                </option>
                            </select>

                        </div>

                        <div class="col-md-6">

                            <label
                                for="firstName"
                                class="form-label"
                            >
                                First Name
                            </label>

                            <input
                                id="firstName"
                                type="text"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6">

                            <label
                                for="lastName"
                                class="form-label"
                            >
                                Last Name
                            </label>

                            <input
                                id="lastName"
                                type="text"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone
                            </label>

                            <input
                                id="phone"
                                type="tel"
                                class="form-control"
                                placeholder="+92..."
                            >

                        </div>

                        <div class="col-md-6">

                            <label
                                for="dateOfBirth"
                                class="form-label"
                            >
                                Date of Birth
                            </label>

                            <input
                                id="dateOfBirth"
                                type="date"
                                class="form-control"
                            >

                        </div>

                        <div class="col-12">

                            <label
                                for="department"
                                class="form-label"
                            >
                                Department
                            </label>

                            <select
                                id="department"
                                class="form-select"
                            >
                                <option value="">
                                    Select department
                                </option>
                            </select>

                        </div>

                    </div>

                    <div
                        class="d-flex justify-content-end gap-2 mt-4"
                    >

                        <button
                            id="cancelPatientButton"
                            type="button"
                            class="btn btn-light"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Patient
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script
        type="module"
        src="../js/patients/patients.js"
    ></script>

</body>

</html>
