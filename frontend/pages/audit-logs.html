<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Logs | MediCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/audit-logs.css">
</head>

<body>

<div class="container-fluid audit-page py-4">

    <div class="audit-header">
        <div>
            <div class="page-eyebrow">
                SECURITY & COMPLIANCE
            </div>

            <h1>Audit Logs</h1>

            <p>
                Review administrative and system activity across MediCore.
            </p>
        </div>
    </div>

    <!-- KPI -->
    <div class="audit-kpis">

        <div class="audit-kpi">
            <div class="kpi-icon">
                <i class="bi bi-journal-text"></i>
            </div>

            <div>
                <span>Total Events</span>
                <strong id="totalEvents">0</strong>
            </div>
        </div>

        <div class="audit-kpi">
            <div class="kpi-icon success">
                <i class="bi bi-check-circle"></i>
            </div>

            <div>
                <span>Successful</span>
                <strong id="successfulEvents">0</strong>
            </div>
        </div>

        <div class="audit-kpi">
            <div class="kpi-icon danger">
                <i class="bi bi-x-circle"></i>
            </div>

            <div>
                <span>Failed</span>
                <strong id="failedEvents">0</strong>
            </div>
        </div>

        <div class="audit-kpi">
            <div class="kpi-icon warning">
                <i class="bi bi-exclamation-circle"></i>
            </div>

            <div>
                <span>Warnings</span>
                <strong id="warningEvents">0</strong>
            </div>
        </div>

    </div>

    <!-- Filters -->
    <div class="audit-filter-card">

        <div class="audit-filter-grid">

            <div>
                <label class="form-label">User</label>

                <input
                    type="text"
                    id="userFilter"
                    class="form-control"
                    placeholder="User ID"
                >
            </div>

            <div>
                <label class="form-label">Module</label>

                <select id="moduleFilter" class="form-select">
                    <option value="">All Modules</option>
                    <option value="authentication">Authentication</option>
                    <option value="patients">Patients</option>
                    <option value="doctors">Doctors</option>
                    <option value="appointments">Appointments</option>
                    <option value="medical-records">Medical Records</option>
                    <option value="prescriptions">Prescriptions</option>
                    <option value="pharmacy">Pharmacy</option>
                    <option value="laboratory">Laboratory</option>
                    <option value="billing">Billing</option>
                    <option value="admissions">Admissions</option>
                    <option value="beds">Beds</option>
                    <option value="discharges">Discharges</option>
                    <option value="staff">Staff</option>
                    <option value="roles">Roles</option>
                    <option value="settings">Settings</option>
                </select>
            </div>

            <div>
                <label class="form-label">Action</label>

                <select id="actionFilter" class="form-select">
                    <option value="">All Actions</option>
                    <option value="create">Create</option>
                    <option value="update">Update</option>
                    <option value="delete">Delete</option>
                    <option value="login">Login</option>
                    <option value="logout">Logout</option>
                    <option value="view">View</option>
                    <option value="export">Export</option>
                    <option value="assign">Assign</option>
                    <option value="approve">Approve</option>
                    <option value="reject">Reject</option>
                </select>
            </div>

            <div>
                <label class="form-label">Status</label>

                <select id="statusFilter" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="success">Success</option>
                    <option value="failed">Failed</option>
                    <option value="warning">Warning</option>
                </select>
            </div>

            <div>
                <label class="form-label">From</label>

                <input
                    type="date"
                    id="fromFilter"
                    class="form-control"
                >
            </div>

            <div>
                <label class="form-label">To</label>

                <input
                    type="date"
                    id="toFilter"
                    class="form-control"
                >
            </div>

        </div>

        <div class="audit-filter-actions">

            <div class="search-wrapper">
                <i class="bi bi-search"></i>

                <input
                    type="search"
                    id="searchFilter"
                    class="form-control"
                    placeholder="Search module, action or target..."
                >
            </div>

            <button
                class="btn btn-primary"
                id="applyFilters"
            >
                <i class="bi bi-funnel"></i>
                Apply Filters
            </button>

            <button
                class="btn btn-outline-secondary"
                id="clearFilters"
            >
                Clear
            </button>

            <button
                class="btn btn-outline-secondary"
                id="refreshLogs"
                title="Refresh"
            >
                <i class="bi bi-arrow-clockwise"></i>
            </button>

        </div>

    </div>

    <!-- Table -->
    <div class="audit-table-card">

        <div class="audit-table-header">

            <div>
                <h2>Activity Log</h2>

                <p id="resultSummary">
                    Loading audit events...
                </p>
            </div>

        </div>

        <div class="table-responsive">

            <table class="table align-middle audit-table">

                <thead>
                    <tr>
                        <th>Actor</th>
                        <th>Module</th>
                        <th>Action</th>
                        <th>Target</th>
                        <th>Status</th>
                        <th>Timestamp</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="auditTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            Loading audit logs...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div
            id="auditPagination"
            class="audit-pagination"
        ></div>

    </div>

</div>

<!-- Details Modal -->
<div
    class="modal fade"
    id="auditDetailsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <div class="modal-eyebrow">
                        AUDIT EVENT
                    </div>

                    <h5 class="modal-title">
                        Audit Details
                    </h5>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>

            <div
                class="modal-body"
                id="auditDetailsBody"
            ></div>

        </div>

    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
></script>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>

<script src="../js/audit-logs/audit-logs-data.js"></script>
<script src="../js/audit-logs/audit-logs-ui.js"></script>
<script src="../js/audit-logs/audit-logs.js"></script>

</body>
</html>
