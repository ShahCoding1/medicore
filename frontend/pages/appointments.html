<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Appointments | MediCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/appointments.css"
    >
</head>

<body>

    <!-- ==========================================
         PAGE
    =========================================== -->

    <div class="container-fluid py-4">

        <!-- ======================================
             PAGE HEADER
        ======================================= -->

        <div
            class="d-flex flex-column flex-lg-row
                   justify-content-between
                   align-items-lg-center
                   gap-3 mb-4"
        >

            <div>
                <div class="text-muted small mb-1">
                    Clinical Operations
                </div>

                <h1 class="h3 fw-bold mb-1">
                    Appointments
                </h1>

                <p class="text-muted mb-0">
                    Manage patient appointments and
                    clinical schedules.
                </p>
            </div>

            <button
                type="button"
                class="btn btn-primary"
                id="addAppointmentBtn"
            >
                <span class="me-1">+</span>
                Add Appointment
            </button>

        </div>

        <!-- ======================================
             FILTERS
        ======================================= -->

        <div class="appointment-filters mb-4">

            <div class="row g-3">

                <div class="col-12 col-lg-5">

                    <label
                        for="appointmentSearch"
                        class="form-label"
                    >
                        Search
                    </label>

                    <input
                        type="search"
                        id="appointmentSearch"
                        class="form-control"
                        placeholder="Search patient or doctor..."
                    >

                </div>

                <div class="col-12 col-md-6 col-lg-3">

                    <label
                        for="appointmentStatusFilter"
                        class="form-label"
                    >
                        Status
                    </label>

                    <select
                        id="appointmentStatusFilter"
                        class="form-select"
                    >
                        <option value="">
                            All statuses
                        </option>

                        <option value="scheduled">
                            Scheduled
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                        <option value="no_show">
                            No Show
                        </option>
                    </select>

                </div>

                <div class="col-12 col-md-6 col-lg-3">

                    <label
                        for="appointmentDateFilter"
                        class="form-label"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="appointmentDateFilter"
                        class="form-control"
                    >

                </div>

                <div
                    class="col-12 col-lg-1
                           d-flex align-items-end"
                >

                    <button
                        type="button"
                        class="btn btn-light border w-100"
                        id="clearAppointmentFilters"
                        title="Clear filters"
                    >
                        ×
                    </button>

                </div>

            </div>

        </div>

        <!-- ======================================
             APPOINTMENTS TABLE
        ======================================= -->

        <div class="appointment-table-wrapper">

            <div
                class="table-responsive"
            >

                <table
                    class="table align-middle
                           mb-0 appointment-table"
                >

                    <thead>
                        <tr>
                            <th>
                                Date & Time
                            </th>

                            <th>
                                Patient
                            </th>

                            <th>
                                Doctor
                            </th>

                            <th>
                                Reason
                            </th>

                            <th>
                                Status
                            </th>

                            <th
                                class="text-end"
                            >
                                Actions
                            </th>
                        </tr>
                    </thead>

                    <tbody
                        id="appointmentsTableBody"
                    >

                        <tr>
                            <td
                                colspan="6"
                                class="text-center py-5"
                            >
                                Loading appointments...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- ==========================================
         APPOINTMENT MODAL
    =========================================== -->

    <div
        class="modal fade"
        id="appointmentModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div
            class="modal-dialog modal-lg
                   modal-dialog-centered"
        >

            <div class="modal-content">

                <div class="modal-header">

                    <div>
                        <h5
                            class="modal-title fw-semibold"
                            id="appointmentModalTitle"
                        >
                            Add Appointment
                        </h5>

                        <p
                            class="text-muted small mb-0"
                        >
                            Schedule a patient appointment.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>

                <form id="appointmentForm">

                    <div class="modal-body">

                        <div class="row g-3">

                            <!-- Patient -->

                            <div class="col-md-6">

                                <label
                                    for="appointmentPatient"
                                    class="form-label"
                                >
                                    Patient
                                    <span class="text-danger">
                                        *
                                    </span>
                                </label>

                                <select
                                    id="appointmentPatient"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Loading patients...
                                    </option>

                                </select>

                            </div>

                            <!-- Doctor -->

                            <div class="col-md-6">

                                <label
                                    for="appointmentDoctor"
                                    class="form-label"
                                >
                                    Doctor
                                    <span class="text-danger">
                                        *
                                    </span>
                                </label>

                                <select
                                    id="appointmentDoctor"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Loading doctors...
                                    </option>

                                </select>

                            </div>

                            <!-- Date -->

                            <div class="col-md-6">

                                <label
                                    for="appointmentDate"
                                    class="form-label"
                                >
                                    Appointment Date
                                    <span class="text-danger">
                                        *
                                    </span>
                                </label>

                                <input
                                    type="date"
                                    id="appointmentDate"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <!-- Time -->

                            <div class="col-md-6">

                                <label
                                    for="appointmentTime"
                                    class="form-label"
                                >
                                    Appointment Time
                                    <span class="text-danger">
                                        *
                                    </span>
                                </label>

                                <input
                                    type="time"
                                    id="appointmentTime"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <!-- Status -->

                            <div class="col-md-6">

                                <label
                                    for="appointmentStatus"
                                    class="form-label"
                                >
                                    Status
                                </label>

                                <select
                                    id="appointmentStatus"
                                    class="form-select"
                                >

                                    <option value="scheduled">
                                        Scheduled
                                    </option>

                                    <option value="completed">
                                        Completed
                                    </option>

                                    <option value="cancelled">
                                        Cancelled
                                    </option>

                                    <option value="no_show">
                                        No Show
                                    </option>

                                </select>

                            </div>

                            <!-- Reason -->

                            <div class="col-12">

                                <label
                                    for="appointmentReason"
                                    class="form-label"
                                >
                                    Reason
                                </label>

                                <textarea
                                    id="appointmentReason"
                                    class="form-control"
                                    rows="3"
                                    maxlength="500"
                                    placeholder="Enter appointment reason..."
                                ></textarea>

                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-light border"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Appointment
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- ==========================================
         SCRIPTS
    =========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>

    <script
        type="module"
        src="../js/appointments/appointments.js"
    ></script>

</body>
</html>
