<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEDICORE | Search</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/search.css">
</head>

<body>

<div class="container-fluid py-4">

    <div class="mc-page-header mb-4">
        <div>
            <span class="text-muted small">MEDICORE</span>
            <h1 class="h3 mb-1">Global Search</h1>
            <p class="text-muted mb-0">
                Search patients, doctors, appointments, invoices and more.
            </p>
        </div>
    </div>

    <div class="mc-search-page-card">

        <div class="mc-search-page-input">
            <span>⌕</span>

            <input
                id="pageSearchInput"
                type="search"
                class="form-control"
                placeholder="Search across MEDICORE..."
                autocomplete="off"
            >

            <span class="mc-search-key">Ctrl K</span>
        </div>

        <div id="searchState" class="mc-search-state">
            <div class="mc-search-empty">
                <div class="mc-search-empty-icon">⌕</div>
                <h5>Search MEDICORE</h5>
                <p>
                    Start typing to find records across the system.
                </p>
            </div>
        </div>

        <div id="searchResultsPage"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

<script src="../js/search/search-data.js"></script>
<script src="../js/search/search-ui.js"></script>
<script src="../js/search/search.js"></script>

</body>
</html>
