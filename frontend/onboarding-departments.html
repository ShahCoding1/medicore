<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Departments | MediCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container py-5">

    <!-- Header -->
    <div class="text-center mb-5">

        <div class="medicore-brand justify-content-center mb-3">
            <span class="brand-mark">M</span>
            <span>MEDICORE</span>
        </div>

        <span class="auth-eyebrow">
            HOSPITAL SETUP
        </span>

        <h1 class="mt-2">
            Add your departments
        </h1>

        <p class="text-muted">
            Configure the departments that operate in your hospital.
        </p>

    </div>


    <!-- Progress -->
    <div class="d-flex justify-content-center gap-2 flex-wrap mb-5">

        <span class="badge bg-light text-dark">
            01 Hospital
        </span>

        <span class="badge bg-primary">
            02 Departments
        </span>

        <span class="badge bg-light text-dark">
            03 Staff
        </span>

        <span class="badge bg-light text-dark">
            04 Preferences
        </span>

        <span class="badge bg-light text-dark">
            05 Complete
        </span>

    </div>


    <div
        class="card border-0 shadow-sm mx-auto"
        style="max-width: 950px;"
    >

        <div class="card-body p-4 p-md-5">

            <div
                id="departmentError"
                class="alert alert-danger d-none"
            ></div>

            <div
                id="departmentSuccess"
                class="alert alert-success d-none"
            ></div>


            <form id="departmentForm" novalidate>

                <div id="departmentList">

                    <!-- First department -->
                    <div class="department-item border rounded-3 p-3 mb-3">

                        <div class="row g-3 align-items-end">

                            <div class="col-md-5">

                                <label class="form-label">
                                    Department Name *
                                </label>

                                <input
                                    type="text"
                                    class="form-control department-name"
                                    placeholder="e.g. Cardiology"
                                    required
                                >

                            </div>


                            <div class="col-md-4">

                                <label class="form-label">
                                    Department Type *
                                </label>

                                <select
                                    class="form-select department-type"
                                    required
                                >

                                    <option value="">
                                        Select type
                                    </option>

                                    <option value="clinical">
                                        Clinical
                                    </option>

                                    <option value="diagnostic">
                                        Diagnostic
                                    </option>

                                    <option value="surgical">
                                        Surgical
                                    </option>

                                    <option value="emergency">
                                        Emergency
                                    </option>

                                    <option value="administrative">
                                        Administrative
                                    </option>

                                    <option value="support">
                                        Support
                                    </option>

                                    <option value="other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-3">

                                <label class="form-label">
                                    Department Head
                                </label>

                                <input
                                    type="text"
                                    class="form-control department-head"
                                    placeholder="Optional"
                                >

                            </div>

                        </div>

                    </div>

                </div>


                <!-- Add department -->
                <button
                    type="button"
                    id="addDepartmentButton"
                    class="btn btn-outline-primary mb-4"
                >
                    + Add Department
                </button>


                <!-- Actions -->
                <div
                    class="d-flex justify-content-between align-items-center mt-4"
                >

                    <button
                        type="button"
                        id="backButton"
                        class="btn btn-outline-secondary"
                    >
                        Back
                    </button>

                    <div class="d-flex gap-2">

                        <button
                            type="button"
                            id="saveExitButton"
                            class="btn btn-outline-secondary"
                        >
                            Save & Exit
                        </button>

                        <button
                            type="submit"
                            id="continueButton"
                            class="btn btn-primary px-4"
                        >
                            <span id="continueText">
                                Continue
                            </span>

                            <span
                                id="continueSpinner"
                                class="spinner-border spinner-border-sm d-none"
                            ></span>

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>

    if (!window.mediCoreAuth.requireAuth()) {
        // Redirect handled by auth.js.
    }

    const form =
        document.getElementById("departmentForm");

    const list =
        document.getElementById("departmentList");

    const addButton =
        document.getElementById("addDepartmentButton");

    const errorBox =
        document.getElementById("departmentError");

    const successBox =
        document.getElementById("departmentSuccess");

    const continueButton =
        document.getElementById("continueButton");

    const continueText =
        document.getElementById("continueText");

    const continueSpinner =
        document.getElementById("continueSpinner");


    // ==========================================
    // ADD DEPARTMENT
    // ==========================================

    addButton.addEventListener("click", () => {

        const item =
            document.createElement("div");

        item.className =
            "department-item border rounded-3 p-3 mb-3";

        item.innerHTML = `
            <div class="row g-3 align-items-end">

                <div class="col-md-5">
                    <label class="form-label">
                        Department Name *
                    </label>

                    <input
                        type="text"
                        class="form-control department-name"
                        placeholder="e.g. Neurology"
                        required
                    >
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Department Type *
                    </label>

                    <select
                        class="form-select department-type"
                        required
                    >
                        <option value="">
                            Select type
                        </option>

                        <option value="clinical">
                            Clinical
                        </option>

                        <option value="diagnostic">
                            Diagnostic
                        </option>

                        <option value="surgical">
                            Surgical
                        </option>

                        <option value="emergency">
                            Emergency
                        </option>

                        <option value="administrative">
                            Administrative
                        </option>

                        <option value="support">
                            Support
                        </option>

                        <option value="other">
                            Other
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">
                        Department Head
                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            class="form-control department-head"
                            placeholder="Optional"
                        >

                        <button
                            type="button"
                            class="btn btn-outline-danger remove-department"
                        >
                            Remove
                        </button>

                    </div>
                </div>

            </div>
        `;

        list.appendChild(item);

    });


    // ==========================================
    // REMOVE DEPARTMENT
    // ==========================================

    list.addEventListener("click", (event) => {

        if (
            event.target.classList.contains(
                "remove-department"
            )
        ) {

            const items =
                document.querySelectorAll(
                    ".department-item"
                );

            if (items.length <= 1) {
                return;
            }

            event.target
                .closest(".department-item")
                .remove();
        }
    });


    // ==========================================
    // SUBMIT
    // ==========================================

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        errorBox.classList.add("d-none");
        successBox.classList.add("d-none");

        if (!form.checkValidity()) {

            form.classList.add("was-validated");

            return;
        }


        const items =
            document.querySelectorAll(
                ".department-item"
            );

        const departments =
            Array.from(items).map((item) => ({
                name:
                    item
                        .querySelector(".department-name")
                        .value
                        .trim(),

                type:
                    item
                        .querySelector(".department-type")
                        .value,

                head:
                    item
                        .querySelector(".department-head")
                        .value
                        .trim()
            }));


        continueButton.disabled = true;

        continueText.textContent = "Saving...";

        continueSpinner.classList.remove("d-none");


        try {

            const response =
                await window.mediCoreAPI.post(
                    "/departments/onboarding",
                    {
                        departments
                    }
                );


            successBox.textContent =
                response.data.message ||
                "Departments saved successfully.";

            successBox.classList.remove("d-none");


            setTimeout(() => {

                window.location.href =
                    "onboarding-staff.html";

            }, 700);


        } catch (error) {

            errorBox.textContent =
                error.response?.data?.message ||
                "Unable to save departments.";

            errorBox.classList.remove("d-none");

            continueButton.disabled = false;

            continueText.textContent =
                "Continue";

            continueSpinner.classList.add("d-none");
        }

    });


    // ==========================================
    // BACK
    // ==========================================

    document
        .getElementById("backButton")
        .addEventListener("click", () => {

            window.location.href =
                "onboarding.html";

        });


    // ==========================================
    // SAVE & EXIT
    // ==========================================

    document
        .getElementById("saveExitButton")
        .addEventListener("click", () => {

            window.location.href =
                "login.html";

        });

</script>

</body>
</html>
