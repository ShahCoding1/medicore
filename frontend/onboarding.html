<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Setup | MediCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container py-5">

    <!-- Header -->
    <div class="text-center mb-5">
        <div class="medicore-brand justify-content-center mb-3">
            <span class="brand-mark">M</span>
            <span>MEDICORE</span>
        </div>

        <span class="auth-eyebrow">HOSPITAL SETUP</span>

        <h1 class="mt-2">Set up your hospital</h1>

        <p class="text-muted">
            Tell us about your healthcare organization.
        </p>
    </div>

    <!-- Progress -->
    <div class="d-flex justify-content-center gap-2 mb-5">
        <span class="badge bg-primary">01 Hospital</span>
        <span class="badge bg-light text-dark">02 Departments</span>
        <span class="badge bg-light text-dark">03 Staff</span>
        <span class="badge bg-light text-dark">04 Preferences</span>
        <span class="badge bg-light text-dark">05 Complete</span>
    </div>

    <div class="card border-0 shadow-sm mx-auto" style="max-width: 900px;">
        <div class="card-body p-4 p-md-5">

            <div id="hospitalError"
                 class="alert alert-danger d-none"></div>

            <div id="hospitalSuccess"
                 class="alert alert-success d-none"></div>

            <form id="hospitalForm" novalidate>

                <div class="row g-4">

                    <!-- Hospital Name -->
                    <div class="col-md-8">
                        <label class="form-label">
                            Hospital Name *
                        </label>

                        <input
                            type="text"
                            id="hospitalName"
                            class="form-control"
                            placeholder="e.g. MediCore General Hospital"
                            required
                        >
                    </div>

                    <!-- Hospital Type -->
                    <div class="col-md-4">
                        <label class="form-label">
                            Hospital Type *
                        </label>

                        <select
                            id="hospitalType"
                            class="form-select"
                            required
                        >
                            <option value="">Select type</option>
                            <option value="general">General Hospital</option>
                            <option value="specialized">Specialized Hospital</option>
                            <option value="teaching">Teaching Hospital</option>
                            <option value="clinic">Clinic</option>
                            <option value="medical_center">Medical Center</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Registration Number -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Registration Number
                        </label>

                        <input
                            type="text"
                            id="registrationNumber"
                            class="form-control"
                            placeholder="Hospital registration number"
                        >
                    </div>

                    <!-- Country -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Country *
                        </label>

                        <input
                            type="text"
                            id="country"
                            class="form-control"
                            value="Pakistan"
                            required
                        >
                    </div>

                    <!-- City -->
                    <div class="col-md-6">
                        <label class="form-label">
                            City *
                        </label>

                        <input
                            type="text"
                            id="city"
                            class="form-control"
                            placeholder="e.g. Peshawar"
                            required
                        >
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Phone *
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="+92 300 1234567"
                            required
                        >
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <label class="form-label">
                            Address *
                        </label>

                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                            placeholder="Complete hospital address"
                            required
                        ></textarea>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Hospital Email *
                        </label>

                        <input
                            type="email"
                            id="hospitalEmail"
                            class="form-control"
                            placeholder="hospital@example.com"
                            required
                        >
                    </div>

                    <!-- Website -->
                    <div class="col-md-6">
                        <label class="form-label">
                            Website
                        </label>

                        <input
                            type="url"
                            id="website"
                            class="form-control"
                            placeholder="https://example.com"
                        >
                    </div>

                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center mt-5">

                    <button
                        type="button"
                        id="saveExitButton"
                        class="btn btn-outline-secondary"
                    >
                        Save & Exit
                    </button>

                    <button
                        type="submit"
                        id="continueHospitalButton"
                        class="btn btn-primary px-4"
                    >
                        <span id="continueText">
                            Continue
                        </span>

                        <span
                            id="continueSpinner"
                            class="spinner-border spinner-border-sm d-none"
                        ></span>
                    </button>

                </div>

            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>

    if (!window.mediCoreAuth.requireAuth()) {
        // Redirect handled automatically.
    }

    const form = document.getElementById("hospitalForm");
    const errorBox = document.getElementById("hospitalError");
    const successBox = document.getElementById("hospitalSuccess");

    const continueButton =
        document.getElementById("continueHospitalButton");

    const continueText =
        document.getElementById("continueText");

    const continueSpinner =
        document.getElementById("continueSpinner");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        errorBox.classList.add("d-none");
        successBox.classList.add("d-none");

        if (!form.checkValidity()) {
            form.classList.add("was-validated");
            return;
        }

        continueButton.disabled = true;
        continueText.textContent = "Saving...";
        continueSpinner.classList.remove("d-none");

        const data = {
            name: document.getElementById("hospitalName").value.trim(),
            type: document.getElementById("hospitalType").value,
            registrationNumber:
                document.getElementById("registrationNumber").value.trim(),
            country: document.getElementById("country").value.trim(),
            city: document.getElementById("city").value.trim(),
            address: document.getElementById("address").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            email: document.getElementById("hospitalEmail").value.trim(),
            website: document.getElementById("website").value.trim()
        };

        try {

            const response =
                await window.mediCoreAPI.post(
                    "/hospitals/onboarding",
                    data
                );

            successBox.textContent =
                response.data.message ||
                "Hospital information saved successfully.";

            successBox.classList.remove("d-none");

            setTimeout(() => {
                window.location.href = "onboarding-departments.html";
            }, 700);

        } catch (error) {

            errorBox.textContent =
                error.response?.data?.message ||
                "Unable to save hospital information.";

            errorBox.classList.remove("d-none");

            continueButton.disabled = false;
            continueText.textContent = "Continue";
            continueSpinner.classList.add("d-none");
        }
    });

    document
        .getElementById("saveExitButton")
        .addEventListener("click", () => {
            window.location.href = "login.html";
        });

</script>

</body>
</html>
